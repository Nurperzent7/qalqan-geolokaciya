# Cloud iOS build for Windows (no local Mac / Xcode).
# Docs: mobile/IOS-WITHOUT-MAC.md
#
# Setup: https://codemagic.io → GitHub Nurperzent7/qalqan-geolokaciya
# Bundle ID: kz.qalqan.geolokaciya

workflows:
  ios-qalqan:
    name: QALQAN iOS
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      # Codemagic → Teams → Integrations → App Store Connect (name must match)
      app_store_connect: codemagic
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: kz.qalqan.geolokaciya
      vars:
        XCODE_PROJECT: "mobile/ios/App/App.xcodeproj"
        XCODE_SCHEME: "App"
      node: 20
      xcode: latest
    scripts:
      - name: Install mobile deps
        script: |
          cd mobile
          npm ci
      - name: Sync Capacitor iOS
        script: |
          cd mobile
          npx cap sync ios
      - name: Set up code signing
        script: xcode-project use-profiles
      - name: Build ipa
        script: |
          xcode-project build-ipa \
            --project "$CM_BUILD_DIR/mobile/ios/App/App.xcodeproj" \
            --scheme App
    artifacts:
      - build/ios/ipa/*.ipa
      - mobile/ios/App/build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      email:
        recipients:
          - $CM_COMMIT_AUTHOR_EMAIL
        notify:
          success: true
          failure: true
      app_store_connect:
        auth: integration
        submit_to_testflight: true
